name: Build routing bundle

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "routing.base.json"
      - "routing.template.json"
      - "rules/**"
      - "scripts/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: routing-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate source and generated template
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/generate-template.sh /tmp/routing.template.json
          diff -u routing.template.json /tmp/routing.template.json
          jq empty routing.base.json routing.template.json

      - name: Download current upstream databases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          upstream="https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release"
          for file in geoip.dat geosite.dat; do
            curl --fail --location --retry 3 --retry-delay 2 \
              "${upstream}/${file}" --output "publish/${file}"
            test -s "publish/${file}"
          done

      - name: Generate routing file and checksums
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/release"
          ./scripts/generate-routing.sh "${base_url}" "$(date +%s)" publish/routing.json
          cd publish
          sha256sum geoip.dat > geoip.dat.sha256sum
          sha256sum geosite.dat > geosite.dat.sha256sum
          sha256sum geoip.dat geosite.dat routing.json > checksums.txt
          jq empty routing.json

      - name: Publish release branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd publish
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add .
          git commit -m "Routing update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin release
